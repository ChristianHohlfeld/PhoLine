<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>PhoLine</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        width: 360px;
        background: #0c0c0b;
        color: #eceae4;
        font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
        padding: 16px;
      }
      h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
      p.lead { margin: 0 0 14px; color: #9c9a93; font-size: 12px; }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 40px;
      }
      select {
        background: #141413;
        color: #eceae4;
        border: 1px solid rgba(236, 234, 228, 0.14);
        border-radius: 8px;
        padding: 8px 10px;
      }
      #stat {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid rgba(236, 234, 228, 0.12);
        border-radius: 10px;
        background: #141413;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        color: #8fa382;
        white-space: pre-wrap;
      }
      #stat.empty { color: #9c9a93; }
      #stat.clickable {
        cursor: pointer;
        user-select: none;
      }
      #stat.clickable:hover {
        border-color: rgba(143, 163, 130, 0.45);
      }
      #detail {
        display: none;
        margin-top: 8px;
        border: 1px solid rgba(236, 234, 228, 0.12);
        border-radius: 10px;
        background: #141413;
        overflow: hidden;
      }
      #detail.open { display: block; }
      .tabs {
        display: flex;
        gap: 0;
        border-bottom: 1px solid rgba(236, 234, 228, 0.12);
      }
      .tabs button {
        flex: 1;
        background: transparent;
        color: #9c9a93;
        border: 0;
        border-bottom: 2px solid transparent;
        padding: 10px 8px;
        font: 12px/1.2 "Segoe UI", system-ui, sans-serif;
        cursor: pointer;
      }
      .tabs button.active {
        color: #eceae4;
        border-bottom-color: #8fa382;
      }
      #detailMeta {
        padding: 8px 12px 0;
        font: 11px/1.4 ui-monospace, Menlo, monospace;
        color: #8fa382;
      }
      #detailBody {
        margin: 0;
        padding: 10px 12px 12px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font: 12px/1.45 ui-monospace, Menlo, monospace;
        color: #eceae4;
      }
      #hint {
        margin-top: 10px;
        color: #9c9a93;
        font-size: 11px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <h1>PhoLine 1.3.4</h1>
    <p class="lead">Ersparnis = Tokens der Anfrage, nicht Wörter. Nach Update: Tab hart neu laden.</p>
    <label>
      Aktiv
      <input id="on" type="checkbox" checked />
    </label>
    <label>
      Decoder
      <select id="lang">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
      </select>
    </label>
    <div id="stat" class="empty">Warte auf Hook … Chat-Tab hart neu laden (Ctrl+Shift+R), dann senden.</div>
    <div id="detail" aria-live="polite">
      <div class="tabs">
        <button type="button" id="tabBefore" class="active">Unbearbeitet</button>
        <button type="button" id="tabAfter">Danach</button>
      </div>
      <div id="detailMeta"></div>
      <pre id="detailBody"></pre>
    </div>
    <p id="hint">HUD sitzt unten rechts im Chat-Tab. Tippe auf „Letzte Anfrage“, um Vorher/Nachher zu sehen.</p>
    <script src="popup.js"></script>
  </body>
</html>
