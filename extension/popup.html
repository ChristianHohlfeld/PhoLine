<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>PhoLine</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        width: 340px;
        background: #0c0c0b;
        color: #eceae4;
        font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
        padding: 16px;
      }
      h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
      p.lead { margin: 0 0 14px; color: #9c9a93; font-size: 12px; }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 40px;
      }
      select {
        background: #141413;
        color: #eceae4;
        border: 1px solid rgba(236, 234, 228, 0.14);
        border-radius: 8px;
        padding: 8px 10px;
      }
      #stat {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid rgba(236, 234, 228, 0.12);
        border-radius: 10px;
        background: #141413;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        color: #8fa382;
        white-space: pre-wrap;
      }
      #stat.empty { color: #9c9a93; }
      #hint {
        margin-top: 10px;
        color: #9c9a93;
        font-size: 11px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <h1>PhoLine 1.3</h1>
    <p class="lead">Ersparnis = Tokens der Anfrage, nicht Wörter. Nach Update: Tab hart neu laden.</p>
    <label>
      Aktiv
      <input id="on" type="checkbox" checked />
    </label>
    <label>
      Decoder
      <select id="lang">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
      </select>
    </label>
    <div id="stat" class="empty">Warte auf Hook … Chat-Tab hart neu laden (Ctrl+Shift+R), dann senden.</div>
    <p id="hint">HUD sitzt unten rechts im Chat-Tab. Das Composer-Feld bleibt unangetastet — umgeschrieben wird der Request.</p>
    <script src="popup.js"></script>
  </body>
</html>
